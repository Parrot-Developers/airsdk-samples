<!DOCTYPE html>
<html>

<head>
    <title>Mission UI Side Panel Sample</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ff8.css" />
</head>

<body class="container sidepanel-container">
    <div class="block">
        <p class="block-title">IMU Telemetry</p>
        <div class="list-secondary font-current">
            <div class="list-row">
                <span class="font-current">Gyro X (rad/s)</span>
                <span class="font-current-details" id="gyroX"> </span>
            </div>
            <div class="list-row">
                <span class="font-current">Gyro Y (rad/s)</span>
                <span class="font-current-details" id="gyroY"> </span>
            </div>
            <div class="list-row">
                <span class="font-current">Gyro Z (rad/s)</span>
                <span class="font-current-details" id="gyroZ"> </span>
            </div>
            <div class="list-row">
                <span class="font-current">Acc X (m/s²)</span>
                <span class="font-current-details" id="accX"> </span>
            </div>
            <div class="list-row">
                <span class="font-current">Acc Y (m/s²)</span>
                <span class="font-current-details" id="accY"> </span>
            </div>
            <div class="list-row">
                <span class="font-current">Acc Z (m/s²)</span>
                <span class="font-current-details" id="accZ"> </span>
            </div>
        </div>
    </div>
    <div class="block">
        <p class="block-title">Communication</p>
        <!-- Insert an input and a button to send a message to the drone -->
        <input type="text" id="messageInput" placeholder="Enter your message here" />
        <button class="btn btn-light" type="button" id="sendMsg" onclick="onClickSendMsg()">Send message to the
            drone</button>
    </div>

    <!-- include WebSocketHelper -->
    <script src="socket-helpers.js"></script>
    <!-- include custom Mission UI JS Script -->
    <script src="script.js"></script>
</body>

</html>
